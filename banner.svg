<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="1" stop-color="#0f3a40"/>
    </linearGradient>
    <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="-32" x2="0" y2="20">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.55" stop-color="#b42323"/>
      <stop offset="1" stop-color="#4f5f4d"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="300" rx="14"/></clipPath>

    <g id="wing">
      <path d="M0,0 L38,-60 L-4,-108 L-92,-92 Q-72,-70 -98,-44 Q-76,-34 -86,0 Q-60,-14 -40,8 Q-16,-6 0,0 Z"/>
      <path d="M-4,-108 L-92,-92 M-4,-108 L-98,-44 M-4,-108 L-86,0 M-4,-108 L-40,8" fill="none" stroke="#3b0a0a" stroke-opacity=".45" stroke-width="1.5"/>
      <path d="M0,0 L38,-60 L-4,-108" fill="none" stroke="#5c0f0f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="cloudRow" fill="#99f6e4" fill-opacity=".08">
      <ellipse cx="120" cy="50" rx="70" ry="14"/>
      <ellipse cx="330" cy="95" rx="90" ry="16"/>
      <ellipse cx="560" cy="40" rx="60" ry="12"/>
      <ellipse cx="760" cy="80" rx="80" ry="15"/>
    </g>
    <path id="hillsBack" d="M0,235 C90,205 170,200 260,228 C330,250 390,215 460,205 C550,192 620,240 700,232 C780,224 840,210 900,235 L900,300 L0,300 Z"/>
    <path id="hillsFront" d="M0,270 C80,255 150,250 230,265 C310,280 380,258 450,255 C540,252 610,278 690,272 C770,266 840,252 900,270 L900,300 L0,300 Z"/>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#99f6e4">
      <circle cx="90" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="22" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="35" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="28" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- scenery scrolls right, so the dragon flies left -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="50s" repeatCount="indefinite"/>
      <use href="#cloudRow"/>
      <use href="#cloudRow" x="-900"/>
    </g>
    <g fill="#0c2a30">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="26s" repeatCount="indefinite"/>
      <use href="#hillsBack"/>
      <use href="#hillsBack" x="-900"/>
    </g>
    <g fill="#07161c">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="13s" repeatCount="indefinite"/>
      <use href="#hillsFront"/>
      <use href="#hillsFront" x="-900"/>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="50" y="100" font-size="44" font-weight="700" fill="#e6fffb">Prem Yelwande</text>
      <text x="52" y="132" font-size="16" fill="#5eead4">AI/ML Engineer · Research Intern @ CSRE, IIT Bombay</text>
      <text x="52" y="158" font-size="12" fill="#64748b">No dragons were harmed in the training of these models.</text>
    </g>

    <!-- dragon -->
    <g transform="translate(670,170)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1s" repeatCount="indefinite"/>

        <!-- far wing -->
        <g transform="translate(-24,-16) scale(-1,1)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="12;-58;12" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1s" begin="-0.12s" repeatCount="indefinite"/>
            <use href="#wing" fill="#7f1d1d"/>
          </g>
        </g>

        <!-- far legs -->
        <g fill="#6b1515">
          <path d="M-56,10 C-50,22 -52,30 -62,36 L-54,38 L-44,30 C-38,22 -40,14 -42,8 Z"/>
          <path d="M8,10 C14,22 12,30 2,36 L10,38 L20,30 C26,22 24,14 22,8 Z"/>
        </g>

        <!-- body: undulating tail -->
        <path fill="url(#bodyGrad)">
          <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
            values="M-130,6 L-126,-8 C-112,-12 -100,-16 -90,-18 C-60,-30 -10,-28 30,-20 C80,-12 120,-18 170,-26 L184,-30 L172,-22 C124,-8 84,0 36,8 C-6,16 -50,18 -86,8 C-106,6 -120,12 -130,12 Z;
                    M-130,6 L-126,-8 C-112,-14 -100,-18 -90,-22 C-60,-34 -10,-32 30,-24 C80,-10 120,-4 170,-4 L186,0 L172,2 C124,6 84,10 36,12 C-6,18 -50,16 -86,4 C-106,2 -120,10 -130,12 Z;
                    M-130,6 L-126,-8 C-112,-12 -100,-16 -90,-18 C-60,-30 -10,-28 30,-20 C80,-12 120,-18 170,-26 L184,-30 L172,-22 C124,-8 84,0 36,8 C-6,16 -50,18 -86,8 C-106,6 -120,12 -130,12 Z"/>
        </path>

        <!-- back spikes -->
        <path fill="#470e07" d="M-106,-13 L-92,-28 L-90,-13 Z M-86,-20 L-72,-35 L-70,-20 Z M-66,-23 L-52,-38 L-50,-23 Z M-46,-24 L-32,-39 L-30,-24 Z M-26,-23 L-12,-38 L-10,-23 Z M-6,-21 L8,-36 L10,-21 Z M14,-18 L28,-33 L30,-18 Z M34,-15 L48,-30 L50,-15 Z M54,-13 L68,-28 L70,-13 Z"/>

        <!-- near legs -->
        <g fill="#9b1c1c">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="6 -50 8;-6 -50 8;6 -50 8" dur="1s" repeatCount="indefinite"/>
            <path d="M-56,10 C-50,22 -52,30 -62,36 L-54,38 L-44,30 C-38,22 -40,14 -42,8 Z"/>
          </g>
          <g>
            <animateTransform attributeName="transform" type="rotate" values="-6 14 8;6 14 8;-6 14 8" dur="1s" repeatCount="indefinite"/>
            <path d="M8,10 C14,22 12,30 2,36 L10,38 L20,30 C26,22 24,14 22,8 Z"/>
          </g>
        </g>

        <!-- head -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-3 -128 0;3 -128 0;-3 -128 0" dur="1s" repeatCount="indefinite"/>
          <path d="M-128,-8 C-140,-14 -156,-12 -172,-2 L-176,2 C-172,6 -160,8 -148,8 C-138,10 -130,6 -126,2 Z" fill="#a31f1f"/>
          <path d="M-130,-10 L-110,-26 L-122,-6 Z" fill="#4b3a2b"/>
          <path d="M-126,-2 L-112,-12 L-120,2 Z" fill="#4b3a2b"/>
          <path d="M-146,-2 L-136,-6 L-134,-3 C-138,0 -142,0 -146,-2 Z" fill="#f8fafc"/>
          <circle cx="-139" cy="-3.5" r="1.3" fill="#1c1917"/>
          <path d="M-174,2 Q-160,5 -148,3" fill="none" stroke="#3b0a0a" stroke-width="1.2" stroke-linecap="round"/>

          <!-- ember puff -->
          <g transform="translate(-176,0)">
            <path d="M0,0 C-14,-8 -28,-6 -42,2 C-28,10 -14,8 0,0 Z" fill="#fb923c">
              <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.55;.72;1" dur="3s" repeatCount="indefinite"/>
              <animateTransform attributeName="transform" type="scale" values="0.1 0.5;0.1 0.5;1 1;1.3 1.1" keyTimes="0;.55;.72;1" dur="3s" repeatCount="indefinite"/>
            </path>
          </g>
        </g>

        <!-- near wing -->
        <g transform="translate(-34,-14) scale(-1,1)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="18;-52;18" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1s" repeatCount="indefinite"/>
            <use href="#wing" fill="#b4382a" fill-opacity=".92"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
