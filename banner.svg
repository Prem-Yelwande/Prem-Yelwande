<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2a33"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#99f6e4">
    <circle cx="120" cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="190" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="185" r="1.3"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="50" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- dragon -->
  <g>
    <animateMotion dur="14s" repeatCount="indefinite" rotate="auto"
      path="M-90,150 C150,50 300,180 450,95 S750,35 990,115"/>

    <!-- back wing -->
    <path d="M-6,-2 C-16,-24 -34,-30 -44,-34 C-36,-20 -30,-12 -22,-2 Z" fill="#0d9488" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate"
        values="10 -6 -2;-20 -6 -2;10 -6 -2" dur="0.7s" repeatCount="indefinite"/>
    </path>

    <!-- tail -->
    <path d="M-20,6 C-34,16 -44,4 -56,12" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="-4" cy="4" rx="18" ry="8" fill="#2dd4bf"/>
    <!-- neck + head -->
    <path d="M10,0 C16,-8 22,-12 28,-12 L40,-9 L31,-5 L26,-1 C20,3 14,6 10,8 Z" fill="#2dd4bf"/>
    <!-- horn + eye -->
    <path d="M26,-12 L22,-19" stroke="#99f6e4" stroke-width="2" stroke-linecap="round"/>
    <circle cx="31" cy="-8" r="1.5" fill="#0b1220"/>

    <!-- front wing -->
    <path d="M-6,-2 C-16,-24 -34,-30 -44,-34 C-36,-20 -30,-12 -22,-2 Z" fill="#5eead4">
      <animateTransform attributeName="transform" type="rotate"
        values="-5 -6 -2;-35 -6 -2;-5 -6 -2" dur="0.7s" repeatCount="indefinite"/>
    </path>

    <!-- tiny flame -->
    <g fill="#99f6e4">
      <ellipse cx="48" cy="-8" rx="5" ry="2.5">
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="2;7;2" dur="1.4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="58" cy="-8" rx="3" ry="1.5">
        <animate attributeName="opacity" values="0;0.8;0" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="108" font-size="46" font-weight="700" fill="#e6fffb">Prem Yelwande</text>
    <text x="62" y="140" font-size="18" fill="#5eead4">AI/ML Engineer · Research Intern @ CSRE, IIT Bombay</text>
    <text x="62" y="170" font-size="13" fill="#64748b">No dragons were harmed in the training of these models.</text>
  </g>
</svg>
